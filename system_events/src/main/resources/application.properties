spring.application.name=system_events
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/system_events_database
spring.datasource.username=root
spring.datasource.password=systemeventspassword
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8094
eureka.client.service-url.defaultZone=http://discoveryservice:8010/eureka
spring.main.allow-bean-definition-overriding=true

# Kafka Consumer Configuration
kafka.bootstrap-servers=broker:9092
kafka.consumer.group-id=all_events_group
kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
